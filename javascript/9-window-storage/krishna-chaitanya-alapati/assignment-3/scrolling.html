<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrolling Demo</title>
  <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

  <div class="scroll-controls">
    <label>X Position: </label>
    <input type="number" id="xPos" placeholder="0">
    <label>Y Position: </label>
    <input type="number" id="yPos" placeholder="0">
    <button onclick="scrollToPosition()">Go to Position</button>
    <br><br>
    <button onclick="scrollUp()">Scroll Up 10px</button>
    <button onclick="scrollDown()">Scroll Down 10px</button>
  </div>

  <div id="div-container"></div>

  <script src="./scripts/scrolling.js"></script>
</body>
</html>
