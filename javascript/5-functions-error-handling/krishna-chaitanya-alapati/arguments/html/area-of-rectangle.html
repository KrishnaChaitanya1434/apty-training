<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function with Default Parameters</title>
  </head>
  <body>
    <h1>Area of Rectangle</h1>
    <form id="inputForm">
      <label for="length">Enter the Length of Rectangle: </label>
      <input type="number" id="length" placeholder="Default is 10"/><br><br>
      <label for="width">Enter the width of Rectangle: </label>
      <input type="number" id="width" placeholder="Default is 5"/><br><br>
      <button type="submit">Calculate Area</button>
    </form><br>
    <div id="output"></div>
    <script src="../scripts/area-of-rectangle.js"></script>
  </body>
</html>
