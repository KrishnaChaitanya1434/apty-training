<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Functions with Default Values</title>
</head>
<body>
    <h1>Nested Functions with Default Values</h1>
    <form id="inputForm">
        <label for="length">Enter the length: </label>
        <input type="number" id="length" placeholder="Default value is 10"/><br><br>
        <label for="width">Enter the width: </label>
        <input type="number" id="width" placeholder="Default value is 5"/><br><br>
        <button type="submit">Get Area and Perimeter</button>
    </form><br>
    <div id="output"></div>
    <script src="../scripts/nested-functions.js"></script>
</body>
