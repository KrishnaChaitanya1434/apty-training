<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higher order with callback</title>
</head>
<body>
    <h1>Array Filtering</h1>
    <form id="inputForm">
        <label for="array">Enter the array numbers(comma-separated): </label>
        <input type="text" id="array"/>
        <label for="maxVal">Enter the max number to filter the array:</label>
        <input type="number" id="maxVal"/>
        <button type="submit">Filter</button>
    </form>
    <h3>Filtered Array:</h3>
    <p id="output"></p>
    <script src="../scripts/array-filtering.js"></script>
</body>
</html>
