<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Higher Order Function</title>
  </head>
  <body>
    <h1>Repeat List Items</h1>
    <form id="inputForm">
      <label for="text">Enter the list item text: </label>
      <input type="text" id="text" required /><br><br>
      <label for="num">Enter the number of times to repeat: </label>
      <input type="number" id="num" /><br><br>
      <button type="submit">Generate list</button>
    </form>
    <h3>Generated list:</h3>
    <ul id="output"></ul>
    <script src="../scripts/higher-order.js"></script>
  </body>
</html>
