<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Error Calculator</title>
  </head>
  <body>
    <h1>Custom Error Calculator</h1>
    <form id="calcForm">
      <label for="num1">Enter First Number:</label>
      <input type="text" id="num1" required /><br /><br />

      <label for="num2">Enter Second Number:</label>
      <input type="text" id="num2" required /><br /><br />

      <label for="operator">Operator (+, -, *, /, %):</label>
      <input type="text" id="operator" required /><br /><br />

      <button type="submit">Calculate</button>
    </form>

    <h3>Result:</h3>
    <p id="output"></p>
    <script src="../scripts/custom-error.js"></script>
  </body>
</html>
