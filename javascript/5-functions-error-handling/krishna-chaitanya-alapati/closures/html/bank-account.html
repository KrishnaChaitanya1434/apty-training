<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account</title>
</head>
<body>
    <h1>Bank Account</h1>
    <form action="#" id="inputForm">
        <label for="amount">Enter the Amount: </label>
        <input type="number" id="amount"/><br><br>

        <button type="button" id="deposit">Deposit</button>
        <button type="button" id="withdraw">Withdraw</button>
        <button type="button" id="check-balance">Show Balance</button>
    </form>
    <h3>Output: </h3>
    <p id="output"></p>
    <script src="../scripts/bank-account.js"></script>
</body>
</html>
