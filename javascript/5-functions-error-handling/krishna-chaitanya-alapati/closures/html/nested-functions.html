<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Functions</title>
</head>
<body>
    <h1>String Concatenation with Nested Functions</h1>
    <form action="#" id="inputForm">
        <label for="outerVal">Enter the First Word: </label>
        <input type="text" id="outerVal"/><br><br>
        <label for="middleVal">Enter the Second Word: </label>
        <input type="text" id="middleVal"/><br><br>
        <label for="innerVal">Enter the Last Word: </label>
        <input type="text" id="innerVal"/><br><br>
        <button type="submit">Concatenate</button>
    </form>
    <p id="output"></p>
    <script src="../scripts/nested-functions.js"></script>
</body>
</html>
