<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
</head>
<body>
    <h1>Simple Interest Calculator</h1>
    <div id="input">
        <label for="amount">Enter the Principal Amount: </label>
        <input type="number" id="amount" required/><br><br>
        <label for="roi">Enter the rate of interest: </label>
        <input type="number" id="roi" required/><br><br>
        <label for="time">Number of years: </label>
        <input type="number" id="time" required/><br><br>
    </div>
    <br>
    <button onclick="calculate()">Calculate S.I</button>
    <br><br>
    <div id="output"></div>
    <script src="./scripts/index.js"></script>
</body>
</html>
