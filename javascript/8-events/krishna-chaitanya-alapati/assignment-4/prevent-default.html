<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prevent Default Demo</title>
  </head>
  <body>
    <h1>Prevent Default Action with Events</h1>
    <h3>Registration Form:</h3>
    <form id="myForm">
      <label>Name:</label>
      <input type="text" id="name" name="name" />

      <label>Email:</label>
      <input type="email" id="email" name="email" /><br/><br/>

      <div id="errorMsg" class="error"></div><br/>
      <button type="submit">Submit</button>
    </form>
    <script src="./scripts/prevent-default.js"></script>
  </body>
</html>
