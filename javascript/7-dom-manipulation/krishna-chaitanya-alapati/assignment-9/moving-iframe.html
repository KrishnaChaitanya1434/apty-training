<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moving Iframe Elements</title>
  </head>
  <body>
    <h1>Moving Table Rows in Iframe</h1>
    <div id="iframeContainer">
      <iframe id="tableIframe" width="300px" height="300px"></iframe>
    </div>
    <div>
      <button id="moveUpBtn">Move Up</button>
      <button id="moveDownBtn">Move Down</button>
      <button id="moveTopBtn">Move Top</button>
      <button id="moveBottomBtn">Move Bottom</button>
    </div>
    <script src="./scripts/moving-iframe.js"></script>
  </body>
</html>
