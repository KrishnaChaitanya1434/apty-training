<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested Element Count</title>
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body>
    <div>
      <p>This is a paragraph inside a div.</p>
      <span>This is a span inside the div.</span>
    </div>
    <p>
      A paragraph element.
      <span>Nested span inside a paragraph.</span>
    </p>
    <div>
      <iframe src="https://www.example.com" width="300" height="200"></iframe>
    </div>
    <button id="countButton">Count Elements</button>
    <ul id="resultDisplay"></ul>
    <script src="./scripts/nested-count.js"></script>
  </body>
</html>
