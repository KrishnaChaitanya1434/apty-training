<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Chunking</title>
  </head>
  <body>
    <h2>Array Chunking</h2>
    <form id="inputForm">
      <label for="arrayInput">Enter array (JSON):</label><br />
      <input
        type="text"
        id="arrayInput"
        placeholder="[1, 2, 3, 4, 5]"
        required
      /><br /><br />

      <label for="chunkSize">Chunk size:</label><br />
      <input
        type="number"
        id="chunkSize"
        placeholder="2"
        required
      /><br /><br />

      <button type="submit">Chunk Array</button>
    </form>

    <h3>Result:</h3>
    <pre id="result"></pre>
    <script src="./scripts/array-chunking.js"></script>
  </body>
</html>
