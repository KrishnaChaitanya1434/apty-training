<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Array Flattening Function</title>
</head>
<body>
    <h1>Creating a Custom Array Flattening App</h1>
    <form id="input">
        <label for="array">Enter the nested array values:</label><br><br>
        <textarea id="array" rows="4" cols="50" placeholder="eg: [1,2,[3,[4,5]]]" required></textarea><br><br>
        <button type="submit">Flatten</button>
    </form>
    <h3>Flattened Array:</h3>
    <p id="output"></p>
    <script src="./scripts/array-flattening.js"></script>
</body>
</html>
