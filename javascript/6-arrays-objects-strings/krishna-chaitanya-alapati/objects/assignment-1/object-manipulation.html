<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Object Manipulation</title>
  </head>
  <body>
    <h2>Object Manipulation with Dynamic Keys</h2>
    <form id="objectForm">
      <label>Key:</label>
      <input type="text" id="keyInput" required /><br /><br />

      <label>Value:</label>
      <input type="text" id="valueInput" required /><br /><br />

      <button type="submit">Add / Update</button>
    </form>

    <h3>Current Object:</h3>
    <p id="result"></p>
    <script src="./scripts/object-manipulation.js"></script>
  </body>
</html>
